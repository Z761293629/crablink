[package]
name = "crablink-server"
version.workspace = true
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock"] }
crablink-api = { path = "../api" }
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
rqrr = { version = "0.11.0", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
