[package]
name = "crablink-server"
version.workspace = true
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock"] }
crablink-api = { path = "../api" }
csv = "1.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
isbot = "0.1.3"
maxminddb = "0.33.0"
openidconnect = { version = "4.1.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rpassword = "7.5.4"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
rqrr = { version = "0.11.0", default-features = false }
tokio = { version = "1.54.1", features = ["sync", "process", "time"] }
tower = { version = "0.5.3", features = ["util"] }
