name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: each job is granted only what it writes.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/z761293629/crablink-server

jobs:
  # Every other job needs this one, so a mismatched tag builds and publishes nothing.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  # One untagged image per architecture, each built natively (a Rust build under QEMU takes
  # tens of minutes). image-merge tags them together, so a failure on either arch publishes nothing.
  image:
    permissions:
      contents: read # build-push-action fetches the Git context with the token
      packages: write
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    permissions:
      packages: write
    needs: [check, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pre-releases get only their version tag; `latest` follows stable releases.
      - env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- -t "$IMAGE:$VERSION"
          if [ "$PRERELEASE" = false ]; then set -- "$@" -t "$IMAGE:latest"; fi
          for digest in *; do set -- "$@" "$IMAGE@sha256:$digest"; done
          docker buildx imagetools create "$@"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    permissions:
      contents: write
    needs: check
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease="$PRERELEASE"

  # Unsigned CLI binaries, attached to the Release as crablink-<target>.tar.gz.
  binaries:
    permissions:
      contents: write
    needs: release
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Provides the musl C toolchain (for ring); musl targets link statically by default.
      - if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: crablink
          package: crablink-cli
          target: ${{ matrix.target }}
          locked: true

  # Regenerates the tap's formula from this Release's binaries (ADR-0004). Like `latest`
  # on the image, pre-releases leave the tap alone.
  homebrew:
    permissions:
      contents: read # gh release download; the tap is written with its own deploy key
    needs: [check, binaries]
    if: needs.check.outputs.prerelease == 'false'
    concurrency: homebrew-tap # one tap push at a time, never cancelled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Z761293629/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # Commits only when the formula changed, so re-running for the same tag is a no-op.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'crablink-*.tar.gz' --dir "$RUNNER_TEMP/assets"
          scripts/homebrew-formula.sh "$VERSION" "$RUNNER_TEMP/assets" >tap/Formula/crablink.rb
          cd tap
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "crablink $VERSION"
          git push origin HEAD:main
