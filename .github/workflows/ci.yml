name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests' embedded Postgres binaries (crates/server/tests/common/pg.rs); bump the key
      # with its major version.
      - uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: embedded-postgres-18-${{ runner.os }}
      - run: cargo test --workspace
        env:
          # On a cache miss the download resolves the version through the GitHub API, whose
          # unauthenticated rate limit a shared runner IP easily exhausts.
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build .

  # The web UI (web/): lint, typecheck, build, then Playwright against the real server with the
  # build embedded. The ci job above builds and tests Rust without it, as contributors may.
  web:
    # Playwright 1.58 has no browser build for ubuntu-latest (26.04); unpin once Playwright is upgraded.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: embedded-postgres-18-${{ runner.os }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
