name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests' embedded Postgres binaries (crates/server/tests/common/pg.rs); bump the key
      # with its major version.
      - uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: embedded-postgres-18-${{ runner.os }}
      - run: cargo test --workspace
        env:
          # On a cache miss the download resolves the version through the GitHub API, whose
          # unauthenticated rate limit a shared runner IP easily exhausts.
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build .
