[workspace]
resolver = "3"
members = ["crates/api", "crates/server", "crates/cli"]

[workspace.package]
version = "0.6.1"

# Unoptimised, password hashing makes every sign-in in the tests take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Unoptimised, signing ID tokens makes the fake Identity Provider take seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
